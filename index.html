<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LumiKids</title>
  
  <!-- Web App Capabilities & Mobile App Styling -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LumiKids">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#58CC02">

  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- Google Font Fredoka & Nunito for vibrant Duolingo aesthetic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    /* ============================================================
       1. DUOLINGO DESIGN SYSTEM & RESET (TODDLER-PROOF TOUCH)
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    :root {
      /* Duolingo signature palette */
      --duo-green: #58CC02;
      --duo-green-dark: #46A302;
      --duo-blue: #1CB0F6;
      --duo-blue-dark: #1899D6;
      --duo-yellow: #FFC800;
      --duo-yellow-dark: #E5A500;
      --duo-orange: #FF9600;
      --duo-orange-dark: #E08500;
      --duo-red: #FF4B4B;
      --duo-red-dark: #EA2B2B;
      --duo-purple: #CE82FF;
      --duo-purple-dark: #A55EEA;
      --duo-gray: #E5E5E5;
      --duo-gray-dark: #AFAFAF;
      --duo-card-bg: #FFFFFF;
      --duo-text: #4B4B4B;
      --duo-bg: #F7F7F7;
      
      --font-family: 'Fredoka', 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, cursive, sans-serif;
    }

    html, body {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: auto;
      touch-action: manipulation;
      font-family: var(--font-family);
      background: #F4FBF1;
      color: var(--duo-text);
    }

    /* Fullscreen app layout */
    #app {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      overscroll-behavior: none;
      background: linear-gradient(180deg, #F0F9ED 0%, #FFFFFF 100%);
    }

    /* ============================================================
       2. DUOLINGO-STYLE HEADER: STREAK, XP, SOUND & MASCOT
       ============================================================ */
    header {
      position: relative;
      z-index: 100;
      background: #FFFFFF;
      border-bottom: 3px solid #E5E5E5;
      padding: clamp(6px, 1.2vh, 10px) clamp(10px, 2.5vw, 20px);
      padding-top: max(clamp(6px, 1.2vh, 10px), env(safe-area-inset-top));
      padding-left: max(clamp(10px, 2.5vw, 20px), env(safe-area-inset-left));
      padding-right: max(clamp(10px, 2.5vw, 20px), env(safe-area-inset-right));
      flex-shrink: 0;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 600px;
      margin: 0 auto;
      gap: 10px;
    }

    /* Brand Logo / Mascot Pill */
    .brand-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(1.1rem, 2.8vw, 1.4rem);
      font-weight: 800;
      color: var(--duo-green);
      cursor: pointer;
    }

    .brand-pill .owl-avatar {
      font-size: 1.6rem;
      animation: cuteWiggle 3s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes cuteWiggle {
      0%, 100% { transform: rotate(0deg) scale(1); }
      15% { transform: rotate(-8deg) scale(1.1); }
      30% { transform: rotate(8deg) scale(1.1); }
      45% { transform: rotate(0deg) scale(1); }
    }

    /* Duolingo Stat Chips */
    .stats-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stat-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #FFFFFF;
      padding: 4px 10px;
      border-radius: 16px;
      font-weight: 800;
      font-size: clamp(0.85rem, 2.2vw, 1rem);
      border: 2px solid #E5E5E5;
      box-shadow: 0 2px 0 #E5E5E5;
    }

    .chip-streak {
      color: var(--duo-orange);
      border-color: #FFE5B4;
      background: #FFF8EE;
      box-shadow: 0 2px 0 #FCD89C;
    }

    .chip-gems {
      color: var(--duo-blue);
      border-color: #D8F2FD;
      background: #F1FAFF;
      box-shadow: 0 2px 0 #B9E6FA;
    }

    .sound-toggle-btn {
      background: #FFFFFF;
      border: 2.5px solid #E5E5E5;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 3px 0 #D5D5D5;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .sound-toggle-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #D5D5D5;
    }

    /* ============================================================
       3. DUOLINGO WINDING LEARNING PATH (VIEWPORT CONTAINER)
       ============================================================ */
    .view-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Section 1: The Winding Stepping-Stone Map */
    #pathScreen {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 16px 80px 16px;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #pathScreen.hidden-screen {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.95);
    }

    /* Section Banner */
    .unit-banner {
      width: 100%;
      max-width: 440px;
      background: var(--duo-green);
      color: #FFFFFF;
      border-radius: 20px;
      padding: 14px 18px;
      box-shadow: 0 6px 0 var(--duo-green-dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .unit-info h3 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .unit-info h2 {
      font-size: 1.35rem;
      font-weight: 800;
    }

    .unit-badge {
      font-size: 2.2rem;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
    }

    /* The Winding Stepping-Stones Path */
    .stepping-stones-path {
      position: relative;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      margin: 10px 0 40px 0;
    }

    /* SVG Connecting Curves between stones */
    .path-svg-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .stone-node {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Winding offsets for snake-like stepping path */
    .stone-node.offset-left-lg  { transform: translateX(-80px); }
    .stone-node.offset-left-sm  { transform: translateX(-42px); }
    .stone-node.offset-center   { transform: translateX(0px); }
    .stone-node.offset-right-sm { transform: translateX(42px); }
    .stone-node.offset-right-lg { transform: translateX(80px); }

    .stone-button {
      position: relative;
      width: clamp(76px, 19vw, 92px);
      height: clamp(76px, 19vw, 92px);
      border-radius: 50%;
      background: #FFFFFF;
      border: 4px solid var(--duo-gray);
      box-shadow: 0 8px 0 var(--duo-gray-dark), 0 10px 20px rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2rem, 5.5vw, 2.6rem);
      outline: none;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .stone-button:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 var(--node-dark, var(--duo-gray-dark));
    }

    /* Completed state */
    .stone-node.completed .stone-button {
      background: var(--duo-yellow);
      border-color: #FFF3C4;
      box-shadow: 0 8px 0 var(--duo-yellow-dark), 0 10px 20px rgba(255, 200, 0, 0.3);
      --node-dark: var(--duo-yellow-dark);
    }

    /* Current active unlocked lesson */
    .stone-node.current .stone-button {
      background: var(--duo-green);
      border-color: #D7F5B6;
      box-shadow: 0 8px 0 var(--duo-green-dark), 0 12px 24px rgba(88, 204, 2, 0.4);
      --node-dark: var(--duo-green-dark);
      animation: pulseActive 2s infinite ease-in-out;
    }

    @keyframes pulseActive {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    /* Locked state */
    .stone-node.locked .stone-button {
      background: #E5E5E5;
      border-color: #F0F0F0;
      box-shadow: 0 8px 0 #C4C4C4;
      opacity: 0.75;
      cursor: not-allowed;
    }

    /* Animated Mascot Sitting on Current Level */
    .mascot-follower {
      position: absolute;
      top: -38px;
      right: -24px;
      font-size: 2.4rem;
      pointer-events: none;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
      animation: mascotHover 2.2s ease-in-out infinite;
      z-index: 10;
    }

    @keyframes mascotHover {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(6deg); }
    }

    /* Floating Speech Bubble from Mascot */
    .mascot-bubble {
      position: absolute;
      bottom: 100%;
      background: #FFFFFF;
      border: 3px solid #E5E5E5;
      border-radius: 16px;
      padding: 6px 12px;
      font-weight: 800;
      font-size: 0.85rem;
      color: var(--duo-text);
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      margin-bottom: 8px;
    }
    .mascot-bubble::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px;
      border-style: solid;
      border-color: #FFFFFF transparent transparent transparent;
    }

    /* Lesson Label Under Stepping-Stone */
    .stone-title {
      margin-top: 10px;
      font-weight: 800;
      font-size: clamp(0.9rem, 2.4vw, 1.05rem);
      color: #3C3C3C;
      text-align: center;
      background: #FFFFFF;
      padding: 3px 12px;
      border-radius: 14px;
      border: 2px solid #E5E5E5;
      box-shadow: 0 2px 0 #E5E5E5;
      white-space: nowrap;
    }

    /* Chest Milestone Node */
    .stone-node.chest-node .stone-button {
      background: var(--duo-purple);
      border-color: #F1D9FF;
      box-shadow: 0 8px 0 var(--duo-purple-dark), 0 10px 20px rgba(206, 130, 255, 0.35);
      --node-dark: var(--duo-purple-dark);
    }

    /* ============================================================
       4. DUOLINGO LESSON SESSION (INTERACTIVE CARDS & WORDS)
       ============================================================ */
    #lessonScreen {
      position: absolute;
      inset: 0;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(10px, 2vh, 18px);
      padding-top: max(clamp(10px, 2vh, 18px), env(safe-area-inset-top));
      padding-bottom: max(clamp(12px, 2.5vh, 20px), env(safe-area-inset-bottom));
      z-index: 200;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.34, 1.2, 0.64, 1);
    }

    #lessonScreen.active-lesson {
      transform: translateY(0);
    }

    /* Lesson Top Bar with Duolingo Green Progress Bar */
    .lesson-header {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      flex-shrink: 0;
    }

    .btn-close-lesson {
      background: none;
      border: none;
      font-size: 1.8rem;
      color: #AFAFAF;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
    }
    .btn-close-lesson:active {
      color: #4B4B4B;
      transform: scale(0.9);
    }

    .lesson-progress-bg {
      flex: 1;
      height: 16px;
      background: #E5E5E5;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    .lesson-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--duo-green);
      border-radius: 12px;
      box-shadow: 0 -2px 0 rgba(0,0,0,0.1) inset;
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .lesson-hearts {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 800;
      color: var(--duo-red);
      font-size: 1.2rem;
    }

    /* Lesson Header Instruction & Mascot */
    .lesson-instruction {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 680px;
      margin: 6px auto;
      width: 100%;
      flex-shrink: 0;
    }

    .lesson-mascot {
      font-size: 2.6rem;
      animation: cuteWiggle 3.5s ease-in-out infinite;
    }

    .instruction-bubble {
      background: #F7F7F7;
      border: 3px solid #E5E5E5;
      border-radius: 18px;
      padding: 8px 16px;
      font-weight: 800;
      font-size: clamp(1.1rem, 3.2vw, 1.35rem);
      color: #3C3C3C;
      position: relative;
      flex: 1;
    }
    .instruction-bubble::before {
      content: '';
      position: absolute;
      left: -12px;
      top: 50%;
      transform: translateY(-50%);
      border-width: 6px;
      border-style: solid;
      border-color: transparent #E5E5E5 transparent transparent;
    }

    /* Word Cards Grid inside Lesson (2x2 or 2x3 large friendly cards) */
    .lesson-cards-container {
      flex: 1;
      display: grid;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: clamp(10px, 2vh, 16px);
      align-items: stretch;
      min-height: 0;
      padding: 6px 0;
    }

    /* Chunky Duolingo Button Cards */
    .duo-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      border: 4px solid var(--duo-gray);
      border-radius: 26px;
      box-shadow: 0 6px 0 var(--duo-gray-dark);
      cursor: pointer;
      outline: none;
      touch-action: manipulation;
      transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
      overflow: hidden;
      padding: 8px;
    }

    .duo-card:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--duo-gray-dark);
    }

    /* Correct Tapped State */
    .duo-card.card-success {
      border-color: var(--duo-green);
      background: #F2FCED;
      box-shadow: 0 6px 0 var(--duo-green-dark);
    }

    /* Disappear animation after sound finishes */
    .duo-card.anim-poof {
      animation: cardPoofOut 0.24s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      pointer-events: none;
    }

    .duo-card.is-hidden {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    @keyframes cardPoofOut {
      0% { transform: scale(1); opacity: 1; }
      40% { transform: scale(1.12); opacity: 0.9; }
      100% { transform: scale(0.1) rotate(10deg); opacity: 0; filter: blur(4px); }
    }

    .duo-card .card-emoji {
      font-size: clamp(3.2rem, 9.5vw, 4.8rem);
      line-height: 1.1;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.12));
      pointer-events: none;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .duo-card:active .card-emoji {
      transform: scale(1.15);
    }

    .duo-card .card-label {
      font-size: clamp(1.2rem, 3.8vw, 1.8rem);
      font-weight: 800;
      color: #3C3C3C;
      letter-spacing: 0.5px;
      margin-top: 6px;
      text-transform: capitalize;
      pointer-events: none;
      text-align: center;
    }

    /* Lesson Bottom Bar */
    .lesson-footer {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
    }

    .speaker-replay-btn {
      background: var(--duo-blue);
      color: #FFFFFF;
      border: none;
      border-radius: 20px;
      padding: 12px 24px;
      font-family: var(--font-family);
      font-size: 1.15rem;
      font-weight: 800;
      box-shadow: 0 5px 0 var(--duo-blue-dark);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      outline: none;
    }
    .speaker-replay-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--duo-blue-dark);
    }

    /* ============================================================
       5. DUOLINGO VICTORY & REWARD CHEST MODAL
       ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .duo-modal-card {
      background: #FFFFFF;
      border-radius: 36px;
      border: 8px solid var(--duo-green);
      padding: clamp(20px, 4vw, 36px);
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      transform: scale(0.7) translateY(40px);
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.active .duo-modal-card {
      transform: scale(1) translateY(0);
    }

    .mascot-celebrate {
      font-size: 5rem;
      animation: cheerJump 0.8s ease-in-out infinite alternate;
    }

    @keyframes cheerJump {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-16px) scale(1.15); }
    }

    .duo-modal-card h2 {
      font-size: clamp(1.8rem, 5.5vw, 2.3rem);
      font-weight: 800;
      color: var(--duo-green);
      line-height: 1.1;
    }

    .duo-modal-card p {
      font-size: clamp(1.05rem, 3.2vw, 1.25rem);
      font-weight: 700;
      color: #777777;
    }

    /* XP & Gem Reward Badges */
    .reward-badges-row {
      display: flex;
      gap: 12px;
      margin: 6px 0;
    }

    .reward-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #F7F7F7;
      border: 3px solid #E5E5E5;
      border-radius: 18px;
      padding: 8px 16px;
      font-size: 1.15rem;
      font-weight: 800;
    }

    .badge-xp {
      color: var(--duo-orange);
      border-color: #FFE5B4;
      background: #FFF8EE;
    }

    .badge-gem {
      color: var(--duo-blue);
      border-color: #D8F2FD;
      background: #F1FAFF;
    }

    /* Interactive 3-Tap Duolingo Treasure Chest */
    .interactive-chest-box {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 4px auto 8px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .chest-sunburst-glow {
      position: absolute;
      inset: -25px;
      border-radius: 50%;
      background: radial-gradient(circle, #FFE58F 20%, rgba(255, 214, 102, 0) 70%);
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.4s ease;
      z-index: 1;
      pointer-events: none;
    }

    .interactive-chest-box.opened .chest-sunburst-glow {
      opacity: 1;
      animation: rotateGlow 8s linear infinite;
    }

    @keyframes rotateGlow {
      from { transform: rotate(0deg) scale(1.2); }
      to { transform: rotate(360deg) scale(1.2); }
    }

    .chest-3d-graphic {
      font-size: 5.5rem;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.2));
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: inline-block;
    }

    /* Chest tap shaking & cracking animations */
    .interactive-chest-box.tap-1 .chest-3d-graphic {
      animation: chestShake1 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    .interactive-chest-box.tap-2 .chest-3d-graphic {
      animation: chestShake2 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    .interactive-chest-box.opened .chest-3d-graphic {
      animation: chestPopOpen 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes chestShake1 {
      0%, 100% { transform: scale(1.08) rotate(0deg); }
      20% { transform: scale(1.15) rotate(-8deg); }
      40% { transform: scale(1.15) rotate(8deg); }
      60% { transform: scale(1.12) rotate(-5deg); }
      80% { transform: scale(1.1) rotate(5deg); }
    }

    @keyframes chestShake2 {
      0%, 100% { transform: scale(1.15) rotate(0deg); }
      15% { transform: scale(1.25) rotate(-14deg); }
      30% { transform: scale(1.25) rotate(14deg); }
      45% { transform: scale(1.2) rotate(-10deg); }
      60% { transform: scale(1.2) rotate(10deg); }
      75% { transform: scale(1.18) rotate(-4deg); }
    }

    @keyframes chestPopOpen {
      0% { transform: scale(1.1) rotate(0deg); }
      35% { transform: scale(1.35) rotate(-8deg); }
      65% { transform: scale(0.9) rotate(4deg); }
      100% { transform: scale(1.2) rotate(0deg); }
    }

    /* 3 Tap Indicator Dots */
    .chest-tap-indicators {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 4px 0 10px 0;
    }

    .tap-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #E5E5E5;
      border: 2px solid #D0D0D0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .tap-dot.active {
      background: var(--duo-yellow);
      border-color: var(--duo-yellow-dark);
      transform: scale(1.35);
      box-shadow: 0 0 10px rgba(255, 200, 0, 0.6);
    }

    .chest-tap-instruction {
      font-weight: 800;
      color: #FF9600;
      font-size: 1.15rem;
      letter-spacing: 0.3px;
      animation: pulseInstruction 1.8s infinite ease-in-out;
    }

    @keyframes pulseInstruction {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }

    .btn-continue {
      width: 100%;
      background: var(--duo-green);
      color: #FFFFFF;
      font-family: var(--font-family);
      font-size: clamp(1.2rem, 3.6vw, 1.5rem);

    }
    .btn-continue:active {

      box-shadow: 0 2px 0 var(--duo-green-dark);

    /* App Persistent State */

    const interactiveChest = document.getElementById('interactiveChest');
    const chestGraphic = document.getElementById('chestGraphic');
    const modalTitle = document.getElementById('modalTitle');

    /* ============================================================
       2. AUDIO SYNTHESIS & FEMALE VOICE ENGINE
       ============================================================ */
    function initAudioContext() {
      if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          audioContext = new AudioCtx();
        }
      }
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
      }
    }

    function unlockAudio() {
      initAudioContext();
      if (synth) {
        try {
          if (synth.paused) synth.resume();
        } catch (e) {}
      }
      audioUnlocked = true;
    }

    // Playful synthesized pop chime
    function playChime(freq = 523.25, type = 'sine') {
      if (!isSoundEnabled) return;
      initAudioContext();
      if (!audioContext) return;

      try {
        if (audioContext.state === 'suspended') audioContext.resume();
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioContext.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.5, audioContext.currentTime + 0.1);

        gain.gain.setValueAtTime(0.3, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.22);

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start();
        osc.stop(audioContext.currentTime + 0.24);
      } catch (e) {}
    }

    // Duolingo victory fanfare
    function playVictoryFanfare() {
      if (!isSoundEnabled) return;
      initAudioContext();
      if (!audioContext) return;

      const notes = [523.25, 659.25, 783.99, 1046.50]; // C Major cheer
      notes.forEach((freq, idx) => {
        setTimeout(() => {
          try {
            if (audioContext.state === 'suspended') audioContext.resume();
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioContext.currentTime);
            gain.gain.setValueAtTime(0.35, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.35);
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start();
            osc.stop(audioContext.currentTime + 0.38);
          } catch (e) {}
        }, idx * 110);
      });
    }

    // Female voice selector
    const FEMALE_VOICE_PREFERENCES = [
      'Samantha', 'Ava', 'Allison', 'Victoria', 'Karen', 'Moira',
      'Google US English', 'Jenny', 'Aria', 'Zira', 'en-US-Neural2-F'
    ];

    function selectBestFemaleVoice() {
      if (!synth) return;
      const voices = synth.getVoices();
      if (!voices || voices.length === 0) return;

      const englishVoices = voices.filter(v => v.lang && (v.lang.startsWith('en') || v.lang.startsWith('en_')));

      for (const pref of FEMALE_VOICE_PREFERENCES) {
        const found = englishVoices.find(v => v.name && v.name.toLowerCase().includes(pref.toLowerCase()));
        if (found) {
          englishFemaleVoice = found;
          return;
        }
      }

      const genericFemale = englishVoices.find(v => {
        const n = (v.name + ' ' + (v.gender || '')).toLowerCase();
        return n.includes('female') || n.includes('woman') || n.includes('girl');
      });
      if (genericFemale) {
        englishFemaleVoice = genericFemale;
        return;
      }

      englishFemaleVoice = englishVoices[0] || voices[0];
    }

    if (synth) {
      selectBestFemaleVoice();
      if (synth.onvoiceschanged !== undefined) {
        synth.onvoiceschanged = selectBestFemaleVoice;
      }
    }

    function speakWord(text, onFinished) {
      if (!isSoundEnabled || !synth) {
        if (onFinished) setTimeout(onFinished, 200);
        return;
      }

      unlockAudio();
      lastSpokenWord = text;

      // Cancel previous pending/stuck utterances immediately so sounds don't queue or overlap
      try {
        synth.cancel();
      } catch (e) {}

      if (!englishFemaleVoice) {
        selectBestFemaleVoice();
      }

      try {
        if (synth.paused) synth.resume();
      } catch (e) {}

      const utterance = new SpeechSynthesisUtterance(text);
      if (englishFemaleVoice) {
        utterance.voice = englishFemaleVoice;
      }

      utterance.lang = 'en-US';
      utterance.rate = 1.05;   // Faster, punchy, immediate toddler response (no long lag)
      utterance.pitch = 1.25;
      utterance.volume = 1.0;

      let hasCompleted = false;
      let safetyTimer = null;

      const completeOnce = () => {
        if (!hasCompleted) {
          hasCompleted = true;
          if (safetyTimer) clearTimeout(safetyTimer);
          if (onFinished) onFinished();
        }
      };

      utterance.onend = () => completeOnce();
      utterance.onerror = () => completeOnce();

      // Short safety timer so toddlers are never left waiting
      const maxDuration = Math.max(500, text.length * 75 + 250);
      safetyTimer = setTimeout(completeOnce, maxDuration);

      try {
        synth.speak(utterance);
        if (synth.paused) synth.resume();
      } catch (e) {
        completeOnce();
      }
    }

    /* ============================================================
       3. STEPPING-STONE MAP RENDERING & MASCOT MOVEMENT
       ============================================================ */
    function renderSteppingStonesMap() {
      stonesPath.innerHTML = '';

      LESSON_LEVELS.forEach((level) => {
        const isCompleted = level.id < currentUnlockedLevel;
        const isCurrent = level.id === currentUnlockedLevel;
        const isLocked = level.id > currentUnlockedLevel;

        const node = document.createElement('div');
        node.className = `stone-node ${level.offset} ${level.isChest ? 'chest-node' : ''}`;
        if (isCompleted) node.classList.add('completed');
        if (isCurrent) node.classList.add('current');
        if (isLocked) node.classList.add('locked');

        // Mascot positioning on current level
        let mascotHtml = '';
        if (isCurrent) {
          mascotHtml = `
            <div class="mascot-follower">
              <div class="mascot-bubble">START!</div>
              🦉
            </div>
          `;
        }

        node.innerHTML = `
          ${mascotHtml}
          <button class="stone-button" aria-label="${level.title}">
            ${isCompleted ? '⭐' : level.badge}
          </button>
          <div class="stone-title">${level.title}</div>
        `;

        // Click to launch lesson if unlocked
        if (!isLocked) {
          node.addEventListener('click', () => {
            playChime(580);
            startLesson(level);
          });
        } else {
          node.addEventListener('click', () => {
            playChime(300, 'triangle');
            speakWord('Finish earlier lessons first!');
          });
        }

        stonesPath.appendChild(node);
      });
    }

    /* ============================================================
       4. DUOLINGO LESSON SESSION LOGIC
       ============================================================ */
    function startLesson(level) {
      activeLevel = level;
      wordsCompletedInLesson = 0;
      updateLessonProgress();

      // Clear any prior speech queue
      try {
        if (synth) synth.cancel();
      } catch (e) {}

      instructionText.textContent = `Tap any picture!`;
      renderLessonCards(level.words);

      lessonScreen.classList.add('active-lesson');
      pathScreen.classList.add('hidden-screen');
    }

    function renderLessonCards(words) {
      lessonCards.innerHTML = '';
      lessonCards.style.pointerEvents = 'auto';

      words.forEach((item) => {
        const card = document.createElement('button');
        card.className = 'duo-card';
        card.setAttribute('type', 'button');
        card.setAttribute('aria-label', item.word);

        card.innerHTML = `
          <span class="card-emoji">${item.emoji}</span>
          <span class="card-label">${item.word}</span>
        `;

        card.addEventListener('click', (e) => handleLessonCardTap(card, item));
        lessonCards.appendChild(card);
      });
    }

    function handleLessonCardTap(cardElement, wordItem) {
      if (cardElement.classList.contains('anim-poof') || cardElement.classList.contains('is-hidden')) {
        return;
      }

      unlockAudio();
      lessonCards.style.pointerEvents = 'none';

      cardElement.classList.add('card-success');
      playChime(440 + Math.random() * 200);

      // Speak word clearly, wait for speech to finish, then poof and hide
      speakWord(wordItem.word, () => {
        cardElement.classList.add('anim-poof');
        setTimeout(() => playChime(620, 'sine'), 50);

        setTimeout(() => {
          cardElement.classList.remove('anim-poof');
          cardElement.classList.add('is-hidden');

          wordsCompletedInLesson++;
          updateLessonProgress();

          lessonCards.style.pointerEvents = 'auto';

          // Check if all 4 words in this stepping stone are finished
          if (wordsCompletedInLesson >= activeLevel.words.length) {
            setTimeout(completeLesson, 300);
          }
        }, 220);
      });
    }

    function updateLessonProgress() {
      const total = activeLevel ? activeLevel.words.length : 4;
      const pct = Math.min((wordsCompletedInLesson / total) * 100, 100);
      lessonProgressFill.style.width = `${pct}%`;
    }

    /* ============================================================
       5. 3-TAP REWARD CHEST SYSTEM (DUOLINGO STYLE)
       ============================================================ */
    const CHEST_TREASURES = ['💎', '👑', '🦄', '🚀', '🦖', '🏆', '🎉', '🌟', '🍭', '🧸'];

    function setupChestOpeningModal() {
      chestTapCount = 0;
      isChestOpened = false;

      // Reset modal UI to unopened state
      interactiveChest.className = 'interactive-chest-box';
      chestGraphic.textContent = '🎁';
      modalTitle.textContent = 'Reward Chest! 🎁';
      chestInstruction.textContent = 'Tap 3 times to open!';
      chestInstruction.style.display = 'block';
      tapIndicators.style.display = 'flex';
      rewardBadges.style.display = 'none';
      continueBtn.style.display = 'none';

      // Reset tap dots
      dot1.className = 'tap-dot';
      dot2.className = 'tap-dot';
      dot3.className = 'tap-dot';

      celebrationModal.classList.add('active');
      playChime(580);
      speakWord('Tap three times to open the chest!');
    }

    function handleChestTap() {
      if (isChestOpened) return;
      unlockAudio();

      chestTapCount++;

      if (chestTapCount === 1) {
        // Tap 1: First wobble and sound
        interactiveChest.className = 'interactive-chest-box tap-1';
        dot1.className = 'tap-dot active';
        playChime(500, 'triangle');
        chestInstruction.textContent = 'Keep going! 2 taps left! ⭐';

      } else if (chestTapCount === 2) {
        // Tap 2: Stronger shake and sound
        interactiveChest.className = 'interactive-chest-box tap-2';
        dot2.className = 'tap-dot active';
        playChime(620, 'triangle');
        chestInstruction.textContent = 'Almost open! 1 tap left! 🌟';

      } else if (chestTapCount >= 3) {
        // Tap 3: CHEST BURSTS OPEN!
        isChestOpened = true;
        dot3.className = 'tap-dot active';
        interactiveChest.className = 'interactive-chest-box opened';

        // Reveal random sparkling treasure
        const prize = CHEST_TREASURES[Math.floor(Math.random() * CHEST_TREASURES.length)];
        chestGraphic.textContent = prize;

        modalTitle.textContent = 'Super Treasure! 🌟';
        chestInstruction.style.display = 'none';
        tapIndicators.style.display = 'none';

        // Play glorious fanfare
        playVictoryFanfare();

        // Duolingo multi-colored confetti shower
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 110,
            spread: 90,
            origin: { y: 0.6 },
            colors: ['#58CC02', '#FFC800', '#1CB0F6', '#FF4B4B', '#CE82FF']
          });

          // Second burst for celebratory impact
          setTimeout(() => {
            confetti({
              particleCount: 40,
              angle: 60,
              spread: 60,
              origin: { x: 0.1, y: 0.7 }
            });
            confetti({
              particleCount: 40,
              angle: 120,
              spread: 60,
              origin: { x: 0.9, y: 0.7 }
            });
          }, 350);
        }

        // Voice cheer
        setTimeout(() => {
          speakWord('Awesome! You opened the treasure!');
        }, 350);

        // Show rewards and Continue button
        setTimeout(() => {
          rewardBadges.style.display = 'flex';
          continueBtn.style.display = 'block';
        }, 600);
      }
    }

    function completeLesson() {
      // Direct to 3-tap interactive chest opening!
      setupChestOpeningModal();
    }

    function closeLesson() {
      lessonScreen.classList.remove('active-lesson');
      pathScreen.classList.remove('hidden-screen');
      lessonCards.innerHTML = '';
      activeLevel = null;
    }

    function onContinueAfterCelebration() {
      celebrationModal.classList.remove('active');
      closeLesson();

      // Advance Stepping-Stone Progression
      if (currentUnlockedLevel < LESSON_LEVELS.length) {
        currentUnlockedLevel++;
      }
      gemCount += 10;
      gemDisplay.textContent = gemCount;

      renderSteppingStonesMap();
      playChime(650);

      // Scroll smoothly down to newly unlocked stepping stone
      setTimeout(() => {
        const activeNode = document.querySelector('.stone-node.current');
        if (activeNode) {
          activeNode.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, 300);
    }

    /* ============================================================
       6. EVENT LISTENERS
       ============================================================ */
    interactiveChest.addEventListener('click', handleChestTap);
    closeLessonBtn.addEventListener('click', closeLesson);
    continueBtn.addEventListener('click', onContinueAfterCelebration);

    replaySoundBtn.addEventListener('click', () => {
      if (lastSpokenWord) {
        playChime(500);
        speakWord(lastSpokenWord);
      }
    });

    soundToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      isSoundEnabled = !isSoundEnabled;
      soundToggle.textContent = isSoundEnabled ? '🔊' : '🔇';
      soundToggle.style.borderColor = isSoundEnabled ? '#E5E5E5' : '#FF4B4B';
    });

    // Touch and Gesture Unlocking (Satisfies Mobile & Fullscreen Policies)
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('touchmove', (e) => {
      if (!e.target.closest('#pathScreen')) {
        e.preventDefault();
      }
    }, { passive: false });

    function triggerFullscreen() {
      const docEl = document.documentElement;
      const requestFS = docEl.requestFullscreen ||
                        docEl.webkitRequestFullscreen ||
                        docEl.mozRequestFullScreen ||
                        docEl.msRequestFullscreen;

      if (requestFS && !document.fullscreenElement && !document.webkitFullscreenElement) {
        try {
          const promise = requestFS.call(docEl);
          if (promise && promise.catch) {
            promise.catch(() => {});
          }
        } catch (e) {}
      }
    }

    function onFirstUserGesture() {
      unlockAudio();
      triggerFullscreen();
    }

    ['click', 'touchstart', 'touchend', 'pointerdown'].forEach((evt) => {
      window.addEventListener(evt, onFirstUserGesture, { once: true, passive: true });
    });

    /* ============================================================
       INITIALIZE & SERVICE WORKER
       ============================================================ */
    window.addEventListener('DOMContentLoaded', () => {
      renderSteppingStonesMap();
      streakDisplay.textContent = streakCount;
      gemDisplay.textContent = gemCount;

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .catch(() => {});
        });
      }
    });
  </script>
</body>
</html>
