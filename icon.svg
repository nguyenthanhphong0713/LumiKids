<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Duolingo Vibrant Green Gradient -->
    <linearGradient id="duoGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78E612"/>
      <stop offset="60%" stop-color="#58CC02"/>
      <stop offset="100%" stop-color="#46A302"/>
    </linearGradient>
    <!-- Belly Soft Light Green -->
    <linearGradient id="duoBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B8F28B"/>
      <stop offset="100%" stop-color="#8EE04E"/>
    </linearGradient>
    <!-- Beak Orange Gradient -->
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC800"/>
      <stop offset="100%" stop-color="#FF9600"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- App Icon Background: Duolingo Forest/Bright Green Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#duoGreen)"/>

  <!-- Subtle 3D bottom bevel on icon -->
  <path d="M0,450 C0,480 32,512 116,512 L396,512 C480,512 512,480 512,450 L512,512 L0,512 Z" fill="#3B8A01" opacity="0.4"/>

  <!-- Lumi The Green Owl Mascot Face (Duolingo Style) -->
  <g filter="url(#softShadow)">
    <!-- Owl Head Feathers / Ears -->
    <path d="M120,180 Q130,95 210,145 Q256,125 302,145 Q382,95 392,180 Q430,300 390,390 Q340,450 256,450 Q172,450 122,390 Q82,300 120,180 Z" fill="#58CC02"/>

    <!-- Light green belly patch -->
    <ellipse cx="256" cy="355" rx="100" ry="75" fill="url(#duoBelly)"/>

    <!-- Big Iconic Duolingo Eyes (White Outer) -->
    <!-- Left Eye White -->
    <circle cx="185" cy="225" r="56" fill="#FFFFFF"/>
    <!-- Right Eye White -->
    <circle cx="327" cy="225" r="56" fill="#FFFFFF"/>

    <!-- Left Eye Pupil (Large, Friendly Dark Slate) -->
    <circle cx="195" cy="228" r="30" fill="#3C3C3C"/>
    <!-- Right Eye Pupil -->
    <circle cx="317" cy="228" r="30" fill="#3C3C3C"/>

    <!-- Eye Catchlights / Sparkles -->
    <circle cx="204" cy="218" r="10" fill="#FFFFFF"/>
    <circle cx="326" cy="218" r="10" fill="#FFFFFF"/>
    <circle cx="188" cy="238" r="4" fill="#FFFFFF"/>
    <circle cx="310" cy="238" r="4" fill="#FFFFFF"/>

    <!-- Duolingo Orange Beak (Chunky Rounded Triangle) -->
    <path d="M228,245 Q256,238 284,245 Q278,295 256,305 Q234,295 228,245 Z" fill="url(#beakGrad)"/>
    <!-- Beak bottom shadow -->
    <path d="M236,285 Q256,305 276,285 Q256,298 236,285 Z" fill="#E08500"/>

    <!-- Rosy Happy Cheeks -->
    <ellipse cx="122" cy="285" rx="18" ry="12" fill="#FF80BF" opacity="0.6"/>
    <ellipse cx="390" cy="285" rx="18" ry="12" fill="#FF80BF" opacity="0.6"/>

    <!-- Playful Owl Feet (Two rounded orange tabs at bottom) -->
    <ellipse cx="215" cy="450" rx="22" ry="12" fill="#FF9600"/>
    <ellipse cx="297" cy="450" rx="22" ry="12" fill="#FF9600"/>
  </g>
</svg>
